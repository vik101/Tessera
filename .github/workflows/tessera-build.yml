name: Tessera build

# Builds and tests Tessera on a Mac, then saves the logs (and the built app)
# to the `tessera-ci` branch so they can be read without the GitHub website.
on:
  push:
    branches: [tessera]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    # bash -eo pipefail: a failing build fails the step even when piped through tee.
    shell: bash

concurrency:
  group: tessera-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          mkdir -p ci-results
          { sw_vers; xcodebuild -version; swift --version; } > ci-results/toolchain.txt 2>&1
          cat ci-results/toolchain.txt

      - name: Build
        id: build
        continue-on-error: true
        run: swift build 2>&1 | tee ci-results/build.log

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: swift test 2>&1 | tee ci-results/test.log

      - name: App bundle
        id: app
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./scripts/build-app.sh debug 2>&1 | tee ci-results/app.log
          ditto -c -k --keepParent build/debug/Tessera.app ci-results/Tessera-debug.zip

      - name: Run against real windows
        id: smoke
        if: steps.app.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 14
        run: ./scripts/smoke-test.sh build/debug/Tessera.app

      - name: Universal release build
        id: release
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./scripts/build-app.sh release 2>&1 | tee ci-results/release.log
          lipo -info build/release/Tessera.app/Contents/MacOS/Tessera | tee -a ci-results/release.log
          ditto -c -k --keepParent build/release/Tessera.app ci-results/Tessera-release.zip

      - name: First launch of the downloadable app
        id: firstlaunch
        if: steps.release.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pkill -x Tessera || true; sleep 1
          defaults delete com.vikram.Tessera >/dev/null 2>&1 || true
          open build/release/Tessera.app
          sleep 8
          screencapture -x ci-results/first-launch.png
          codesign -dv --verbose=2 build/release/Tessera.app > ci-results/codesign.txt 2>&1
          pgrep -x Tessera && echo "running" | tee ci-results/first-launch.txt

      - name: Publish results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "build: ${{ steps.build.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "app: ${{ steps.app.outcome }}"
            echo "smoke: ${{ steps.smoke.outcome }}"
            echo "checks: $(head -1 ci-results/results.txt 2>/dev/null || echo none)"
            echo "release: ${{ steps.release.outcome }}"
            echo "firstlaunch: ${{ steps.firstlaunch.outcome }}"
          } > ci-results/summary.txt
          grep -E "(error|warning):" ci-results/build.log | sort -u > ci-results/diagnostics.txt || true
          rm -rf ci-results/.git
          cd ci-results
          git init -q -b tessera-ci
          git config user.name "Tessera CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tessera-ci

  latest-xcode:
    # The newest macOS image, to catch problems with the newest Swift.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        id: check
        continue-on-error: true
        run: |
          mkdir -p ci-latest
          { sw_vers; xcodebuild -version; swift --version; } > ci-latest/toolchain.txt 2>&1
          swift build 2>&1 | tee ci-latest/build.log
          swift test 2>&1 | tee ci-latest/test.log
      - name: Publish results
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "commit: ${GITHUB_SHA}"; echo "latest: ${{ steps.check.outcome }}"; } > ci-latest/summary.txt
          cd ci-latest
          git init -q -b tessera-ci-latest
          git config user.name "Tessera CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Latest-Xcode results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tessera-ci-latest

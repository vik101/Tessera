name: Tessera build

# Builds and tests Tessera on a Mac, then saves the logs (and the built app)
# to the `tessera-ci` branch so they can be read without the GitHub website.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - Casks/**
      - .github/workflows/launch-test.yml
      - scripts/ci/launch-test.sh
      - scripts/ci/vdisplay.m
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    # bash -eo pipefail: a failing build fails the step even when piped through tee.
    shell: bash

concurrency:
  group: tessera-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 85
    env:
      # Set once by scripts/setup-release-keys.sh. Without them, builds are ad-hoc signed and don't auto-update.
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      HAS_CERTIFICATE: ${{ secrets.SIGNING_P12 != '' || secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
        run: ./scripts/ci/import-certificates.sh >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          mkdir -p ci-results
          { sw_vers; xcodebuild -version; swift --version; } > ci-results/toolchain.txt 2>&1
          cat ci-results/toolchain.txt

      - name: Build
        id: build
        continue-on-error: true
        run: swift build 2>&1 | tee ci-results/build.log

      - name: Test
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: swift test 2>&1 | tee ci-results/test.log

      - name: App bundle
        id: app
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./scripts/build-app.sh debug 2>&1 | tee ci-results/app.log
          ditto -c -k --keepParent build/debug/Tessera.app ci-results/Tessera-debug.zip

      - name: Run against real windows
        id: smoke
        if: steps.app.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: ./scripts/smoke-test.sh build/debug/Tessera.app

      - name: Universal release build
        id: release
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ./scripts/build-app.sh release 2>&1 | tee ci-results/release.log
          lipo -info build/release/Tessera.app/Contents/MacOS/Tessera | tee -a ci-results/release.log
          ditto -c -k --keepParent build/release/Tessera.app ci-results/Tessera-release.zip

      - name: First launch of the downloadable app
        id: firstlaunch
        if: steps.release.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pkill -x Tessera || true; sleep 1
          defaults delete com.vikram.Tessera >/dev/null 2>&1 || true
          open build/release/Tessera.app
          sleep 8
          screencapture -x ci-results/first-launch.png
          codesign -dv --verbose=2 build/release/Tessera.app > ci-results/codesign.txt 2>&1
          pgrep -x Tessera && echo "running" | tee ci-results/first-launch.txt

      - name: GitHub release (once per version, only when every check passed)
        id: publish_release
        if: github.ref == 'refs/heads/main' && steps.smoke.outcome == 'success' && steps.release.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: ./scripts/ci/publish-release.sh ci-results

      - name: Publish results
        # Not when cancelled: a half-finished run must not replace the download.
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "commit: ${GITHUB_SHA}"
            echo "build: ${{ steps.build.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "app: ${{ steps.app.outcome }}"
            echo "smoke: ${{ steps.smoke.outcome }}"
            echo "checks: $(head -1 ci-results/results.txt 2>/dev/null || echo none)"
            echo "release: ${{ steps.release.outcome }}"
            echo "firstlaunch: ${{ steps.firstlaunch.outcome }}"
            echo "github-release: ${{ steps.publish_release.outcome }}"
          } > ci-results/summary.txt
          grep -E "(error|warning):" ci-results/build.log | sort -u > ci-results/diagnostics.txt || true
          rm -rf ci-results/.git
          cd ci-results
          git init -q -b tessera-ci
          git config user.name "Tessera CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tessera-ci

  signing:
    # Proves the update pipeline with throwaway keys: same-certificate updates keep Accessibility,
    # Sparkle signs the download, the appcast checks out. Results go to tessera-ci-signing.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build with a throwaway update key
        id: build
        continue-on-error: true
        run: |
          mkdir -p signing-results
          python3 -m pip install --quiet --break-system-packages cryptography || python3 -m pip install --quiet cryptography
          export ED_KEY_DIR="$RUNNER_TEMP/ed" && mkdir -p "$ED_KEY_DIR"
          export SPARKLE_PUBLIC_KEY=$(python3 scripts/ci/make-ed-key.py "$ED_KEY_DIR")
          echo "ED_KEY_DIR=$ED_KEY_DIR" >> "$GITHUB_ENV"
          ./scripts/build-app.sh debug 2>&1 | tee signing-results/app.log
      - name: Signing and update test
        id: signing
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        run: ./scripts/ci/signing-test.sh build/debug/Tessera.app signing-results
      - name: Publish results
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p signing-results
          {
            echo "commit: ${GITHUB_SHA}"
            echo "build: ${{ steps.build.outcome }}"
            echo "signing: ${{ steps.signing.outcome }}"
            echo "checks: $(head -1 signing-results/results.txt 2>/dev/null || echo none)"
          } > signing-results/summary.txt
          cd signing-results
          git init -q -b tessera-ci-signing
          git config user.name "Tessera CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Signing test for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tessera-ci-signing

  latest-xcode:
    # The newest macOS (Tahoe) and Swift: build, unit tests, and the full real-window test.
    runs-on: macos-26
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        id: check
        continue-on-error: true
        run: |
          mkdir -p ci-latest
          { sw_vers; xcodebuild -version; swift --version; } > ci-latest/toolchain.txt 2>&1
          swift build 2>&1 | tee ci-latest/build.log
          swift test 2>&1 | tee ci-latest/test.log
      - name: Run against real windows on Tahoe
        id: smoke
        if: steps.check.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 48
        run: |
          ./scripts/build-app.sh debug 2>&1 | tee ci-latest/app.log
          ./scripts/smoke-test.sh build/debug/Tessera.app
      - name: Publish results
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-latest/smoke
          cp -R ci-results/. ci-latest/smoke/ 2>/dev/null || true
          {
            echo "commit: ${GITHUB_SHA}"
            echo "latest: ${{ steps.check.outcome }}"
            echo "smoke: ${{ steps.smoke.outcome }}"
            echo "checks: $(head -1 ci-latest/smoke/results.txt 2>/dev/null || echo none)"
          } > ci-latest/summary.txt
          cd ci-latest
          git init -q -b tessera-ci-latest
          git config user.name "Tessera CI"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Latest-Xcode results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tessera-ci-latest

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Test core
        run: swift test
      - name: Build app
        run: ./scripts/build-app.sh debug
      - name: Check translations
        run: python3 scripts/strings.py check Resources/Localizable.xcstrings
